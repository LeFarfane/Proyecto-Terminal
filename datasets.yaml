# =============================================================================
# datasets.yaml  —  Source of truth for the IBD miRNA-seq pipeline
# =============================================================================
# This manifest is the single registry of every dataset in the project. It is
# meant to drive both:
#   * the orchestrator CLI  (run.py status / run / report)
#   * the cross-dataset dashboard / master report
# so that nothing has to be inferred from folder-name prefixes (n_ / d_ / ignore_)
# ever again.
#
# status values:
#   analyzed     full pipeline complete, Final_Report.html exists
#   in_progress  download/quant done or running, downstream DEA not finished
#   suspended    intentionally parked; kept for the record, skipped by runs
#
# When adding a dataset: copy a block, fill what you know, set the status.
# Unknown fields can be left as null — the tooling treats null as "unknown".
# =============================================================================

project:
  name: "miRNA-seq meta-analysis of inflammatory bowel disease (IBD)"
  organism: "Homo sapiens"
  outputs_root: "outputs"
  pipeline_root: "pipelines"
  # Canonical pipeline stages (script directory -> human label). The runner can
  # use these keys as --from / --to targets.
  stages:
    "00_search":         "GEO/SRA discovery & curation"
    "01_download":       "SRA download (prefetch + fasterq-dump)"
    "02_qc":             "FastQC / miRTrace QC + sample organization"
    "03_quant":          "miRNA quantification (miRge3)"
    "04_merge":          "Count-matrix merge + DESeq2 metadata"
    "05_dea_r":          "Differential expression (DESeq2)"
    "06_targets_enrich": "Target prediction (multiMiR) + GO/KEGG enrichment"
    "07_networks_clin":  "Networks, HMDD, IBD overlap, clinical ROC"
    "08_report":         "Per-dataset Final_Report.html"

# -----------------------------------------------------------------------------
datasets:

  # ----- ANALYZED -----------------------------------------------------------
  - id: GSE84779
    accession: GSE84779
    bioproject: PRJNA331127
    pmid: 27536783
    status: analyzed
    output_dir: outputs/n_GSE84779
    title: >-
      MicroRNAs expression in the ileal pouch of patients with ulcerative
      colitis is robustly up-regulated and correlates with disease phenotypes
    url: https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE84779
    library_strategy: miRNA-Seq
    library_layout: SINGLE
    tissue: "ileal mucosa"
    diseases: [NC, "NP-P", CLDP, IlealCD, UC, "CP-P"]
    control_label: NC
    comparisons: [IlealCD, UlcerativeColitis]
